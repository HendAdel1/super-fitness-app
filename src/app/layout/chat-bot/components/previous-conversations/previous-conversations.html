<div class="previous-conversations">
  <div class="previous-conversations__header">
    <h2 class="previous-conversations__title">
      {{ 'CHATBOT.PREVIOUS_CONVERSATIONS' | translate }}
    </h2>
    <button
      class="previous-conversations__new-btn"
      type="button"
      [attr.aria-label]="'CHATBOT.NEW_CONVERSATION' | translate"
      [title]="'CHATBOT.NEW_CONVERSATION' | translate"
      (click)="onNewConversation()"
    >
      <svg
        class="previous-conversations__new-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>
  </div>

  <div class="previous-conversations__list">
    @for (conversation of conversations(); track conversation.id) {
      <button
        class="previous-conversations__item"
        type="button"
        (click)="onSelectConversation(conversation)"
      >
        <span class="previous-conversations__item-title">{{ conversation.title }}</span>
        <svg
          class="previous-conversations__item-arrow"
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ff4100"
          stroke-width="2.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 18 15 12 9 6" />
        </svg>
      </button>
    } @empty {
      <p class="previous-conversations__empty">No previous conversations yet.</p>
    }
  </div>
</div>
