<section class="relative min-h-dvh bg-ink flex flex-col">
  <!-- Top Navigation Bar -->
  <app-navbar />

  <!-- Main Content Canvas -->
  <main class="flex-1 p-6">
    <header class="border-b border-metal/20 pb-4">
      <h1 class="text-xl font-bold font-baloo text-white">{{ 'HOME.WELCOME_BACK' | translate }}</h1>
    </header>
  </main>

  <app-marquee-banner
    [services]="['HIIT & CARDIO', 'CROSSFIT ZONE', 'NUTRITION CONSULTING', 'YOGA & PILATES']"
    [animationSpeed]="20"
  />

  <!-- Floating Preferences Widget (Language & Theme) -->
  <aside class="fixed bottom-4 start-4 sm:bottom-6 sm:start-6 z-50 pointer-events-auto">
    <app-language-switcher />
  </aside>
</section>
