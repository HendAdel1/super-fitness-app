<div class="register-form flex w-full flex-col gap-4">
  <app-auth-heading lead="Hey There" headline="Create An Account" />

  <form
    class="register-form__form flex w-full flex-col gap-4 rounded-[50px] border border-muted px-[87.5px] py-[40px]"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <h2 class="register-form__title m-0 text-center font-baloo text-xl font-bold text-white">
      Register
    </h2>

    <app-auth-input
      type="text"
      placeholder="First Name"
      formControlName="firstName"
      autocomplete="given-name"
    />

    <app-auth-input
      type="text"
      placeholder="Last Name"
      formControlName="lastName"
      autocomplete="family-name"
    />

    <app-auth-input type="email" placeholder="Email" formControlName="email" autocomplete="email" />

    <app-auth-input
      type="password"
      placeholder="Password"
      formControlName="password"
      autocomplete="new-password"
    />

    <div class="register-form__password flex flex-col gap-1">
      <app-auth-input
        type="password"
        placeholder="Re-Password"
        formControlName="rePassword"
        autocomplete="new-password"
      />
      <app-auth-link customClass="text-end">
        <a link routerLink="/auth/forgot-password" class="font-rubik text-sm">Forget Password ?</a>
      </app-auth-link>
    </div>

    <div class="register-form__social flex flex-col gap-3">
      <app-auth-or-divider />
      <app-auth-social-media-icons />
    </div>

    <div class="register-form__cta flex flex-col gap-2">
      <app-auth-button kind="next" type="submit" />

      <app-auth-link>
        <span text>Already Have An Account ? </span>
        <a link routerLink="/auth/login">Login</a>
      </app-auth-link>
    </div>
  </form>
</div>
