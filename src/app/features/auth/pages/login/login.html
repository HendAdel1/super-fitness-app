<div class="login flex w-full flex-col gap-4">
  <app-auth-heading lead="Hey There" headline="WELCOME BACK" />

  <form
    class="login__form flex w-full flex-col gap-4 rounded-[50px] border border-muted px-[87.5px] py-[40px]"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <h2 class="login__title m-0 text-center font-baloo text-xl font-bold text-white">Login</h2>

    <app-auth-input type="email" placeholder="Email" formControlName="email" autocomplete="email" />

    <div class="login__password flex flex-col gap-1">
      <app-auth-input
        type="password"
        placeholder="Password"
        formControlName="password"
        autocomplete="current-password"
      />
      <app-auth-link customClass="text-end">
        <a link routerLink="/auth/forgot-password" class="font-rubik text-sm">Forgot Password?</a>
      </app-auth-link>
    </div>

    <div class="login__social flex flex-col gap-3">
      <app-auth-or-divider />
      <app-auth-social-media-icons />
    </div>

    @if (loginError(); as message) {
      <app-auth-error [message]="message" />
    }

    <div class="login__cta flex flex-col gap-2">
      <app-auth-button kind="login" type="submit" />

      <app-auth-link>
        <span text>Dont Have An Account Yet ? </span>
        <a link routerLink="/auth/register">Register</a>
      </app-auth-link>
    </div>
  </form>
</div>
