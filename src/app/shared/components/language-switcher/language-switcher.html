<div
  class="relative inline-flex flex-col items-center rounded-full bg-[#1c1c1e] p-1 border border-[#2c2c2e] shadow-2xl backdrop-blur-md select-none transition-all duration-300"
  role="region"
  aria-label="Language and theme preferences"
>
  <!-- Language Section -->
  <div class="flex flex-col items-center gap-0.5" role="group" aria-label="Language selector">
    <!-- English Button -->
    <button
      type="button"
      (click)="selectLanguage('en')"
      [class.bg-[#ff4100]]="currentLang() === 'en'"
      [class.text-white]="currentLang() === 'en'"
      [class.shadow-md]="currentLang() === 'en'"
      [class.text-[#8e8e93]]="currentLang() !== 'en'"
      [class.hover:text-white]="currentLang() !== 'en'"
      class="relative z-10 flex h-8 w-8 cursor-pointer items-center justify-center rounded-full font-inter text-xs font-bold tracking-wider transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500/50"
      [attr.aria-pressed]="currentLang() === 'en'"
      title="English"
      data-test="lang-en"
    >
      EN
    </button>

    <!-- Arabic Button -->
    <button
      type="button"
      (click)="selectLanguage('ar')"
      [class.bg-[#ff4100]]="currentLang() === 'ar'"
      [class.text-white]="currentLang() === 'ar'"
      [class.shadow-md]="currentLang() === 'ar'"
      [class.text-[#8e8e93]]="currentLang() !== 'ar'"
      [class.hover:text-white]="currentLang() !== 'ar'"
      class="relative z-10 flex h-8 w-8 cursor-pointer items-center justify-center rounded-full font-inter text-xs font-bold tracking-wider transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500/50"
      [attr.aria-pressed]="currentLang() === 'ar'"
      title="العربية"
      data-test="lang-ar"
    >
      AR
    </button>
  </div>

  <!-- Divider -->
  <div class="my-1 h-[1px] w-3.5 rounded-full bg-[#3a3a3c]" aria-hidden="true"></div>

  <!-- Theme Section -->
  <div class="flex flex-col items-center gap-0.5" role="group" aria-label="Theme selector">
    <!-- Light Mode (Sun) Button -->
    <button
      type="button"
      (click)="selectTheme('light')"
      [class.bg-[#ff4100]]="currentTheme() === 'light'"
      [class.text-white]="currentTheme() === 'light'"
      [class.shadow-md]="currentTheme() === 'light'"
      [class.text-[#8e8e93]]="currentTheme() !== 'light'"
      [class.hover:text-white]="currentTheme() !== 'light'"
      class="relative z-10 flex h-8 w-8 cursor-pointer items-center justify-center rounded-full transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500/50"
      [attr.aria-pressed]="currentTheme() === 'light'"
      title="Light Mode"
      data-test="theme-light"
    >
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>
      </svg>
    </button>

    <!-- Dark Mode (Moon) Button -->
    <button
      type="button"
      (click)="selectTheme('dark')"
      [class.bg-[#ff4100]]="currentTheme() === 'dark'"
      [class.text-white]="currentTheme() === 'dark'"
      [class.shadow-md]="currentTheme() === 'dark'"
      [class.text-[#8e8e93]]="currentTheme() !== 'dark'"
      [class.hover:text-white]="currentTheme() !== 'dark'"
      class="relative z-10 flex h-8 w-8 cursor-pointer items-center justify-center rounded-full transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500/50"
      [attr.aria-pressed]="currentTheme() === 'dark'"
      title="Dark Mode"
      data-test="theme-dark"
    >
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    </button>
  </div>
</div>
