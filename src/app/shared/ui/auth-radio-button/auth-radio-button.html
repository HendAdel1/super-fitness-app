<div role="radiogroup" class="flex flex-col gap-4">
  @for (option of options(); track option.id) {
    <label
      class="flex items-center justify-between px-6 py-4 rounded-full cursor-pointer transition-all duration-200 has-[:focus-visible]:outline has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-orange-500 has-[:focus-visible]:outline-offset-2"
      [class]="value() === option.value 
        ? 'border border-orange-500 bg-white/5 text-orange-500' 
        : 'border border-white/15 bg-white/5 text-gray-300 hover:bg-white/10'">
      
      <span class="font-medium text-lg select-none">{{ option.label }}</span>
      
      <!-- Radio Indicator -->
      <div 
        class="w-6 h-6 rounded-full border-[1.5px] flex items-center justify-center transition-all duration-200 shrink-0"
        [class]="value() === option.value ? 'border-orange-500' : 'border-gray-400'">
        @if (value() === option.value) {
          <div class="w-3 h-3 rounded-full bg-orange-500"></div>
        }
      </div>

      <input 
        type="radio" 
        [value]="option.value"
        [checked]="value() === option.value"
        (change)="selectOption(option.value)"
        class="sr-only"
        [attr.name]="name()"
      />
    </label>
  }
</div>
